name: Deploy WebXR Studio to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Stage static WebXR bundle
        run: |
          mkdir -p _site
          touch _site/.nojekyll
          for f in index.html app.js scene_blueprint.json; do
            if [ -f "$f" ]; then cp "$f" _site/; fi
          done
          for d in assets entities; do
            if [ -d "$d" ]; then cp -r "$d" _site/; fi
          done

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
